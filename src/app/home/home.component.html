<app-nav [identity]="config.identity" [items]="config.nav"></app-nav>

<main class="home">
  <app-hero [identity]="config.identity"></app-hero>

  <app-about [about]="config.about"></app-about>

  <app-skills [groups]="config.skills"></app-skills>

  <app-projects
    sectionId="work"
    label="work"
    title="Professional projects"
    blurb="Things I've built and shipped at Cisco."
    [items]="config.projects.professional"
    emptyMessage="Empty for now.">
  </app-projects>

  <app-projects
    sectionId="projects"
    label="personal"
    title="Personal projects"
    blurb="Side projects, experiments, and things I build on weekends."
    [items]="config.projects.personal"
    emptyMessage="Coming soon — I'll add things here as I ship them.">
  </app-projects>

  <app-experience [items]="config.experience"></app-experience>

  <app-writing [entries]="config.writing || []"></app-writing>

  <app-contact
    [email]="config.email"
    [socials]="config.socials"
    [name]="config.identity.name">
  </app-contact>
</main>
